<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatAsset — 質問履歴</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 24px; }
  .empty { color: #888; padding: 40px 0; text-align: center; }
  .item {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .meta {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
  }
  .provider {
    background: #eef2ff;
    color: #3730a3;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .question { white-space: pre-wrap; line-height: 1.6; margin-bottom: 8px; }
  .link { font-size: 13px; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  #refresh {
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  #search {
    flex: 1;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .no-match { color: #888; padding: 24px 0; text-align: center; }
  .summary { font-weight: 600; line-height: 1.6; margin-bottom: 4px; }
  .toggle-full {
    background: none;
    border: none;
    padding: 0;
    color: #2563eb;
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .question.collapsed { display: none; }
  .summarize-btn {
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    margin-bottom: 8px;
  }
  .summarize-btn:disabled { opacity: 0.6; cursor: default; }
  .summarize-error { color: #b91c1c; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>ChatAsset — 質問履歴</h1>
<div class="subtitle">自分がAIに何を質問してきたかの記録</div>
<div class="toolbar">
  <input type="search" id="search" placeholder="質問文・AI名で検索" />
  <button id="refresh">更新</button>
</div>
<div id="list"></div>

<script>
let allQuestions = [];
// Below this length, summarizing isn't worth an API call.
const SUMMARIZE_THRESHOLD = 40;

async function loadQuestions() {
  const listEl = document.getElementById("list");
  listEl.textContent = "読み込み中...";
  try {
    const res = await fetch("/api/questions");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const questions = await res.json();
    questions.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    allQuestions = questions;
    applySearch();
  } catch (err) {
    listEl.textContent = "読み込みに失敗しました: " + err.message;
  }
}

function applySearch() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  if (!query) {
    render(allQuestions);
    return;
  }
  const filtered = allQuestions.filter((q) => {
    const haystack = `${q.question || ""} ${q.questionSummary || ""} ${q.provider || ""}`.toLowerCase();
    return haystack.includes(query);
  });
  render(filtered, query);
}

function formatTimestamp(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function render(questions, query) {
  const listEl = document.getElementById("list");
  listEl.innerHTML = "";

  if (questions.length === 0) {
    const empty = document.createElement("div");
    empty.className = query ? "no-match" : "empty";
    empty.textContent = query
      ? `「${query}」に一致する質問はありません。`
      : "まだ質問が記録されていません。ChatGPTで質問してみてください。";
    listEl.appendChild(empty);
    return;
  }

  for (const q of questions) {
    const item = document.createElement("div");
    item.className = "item";

    const meta = document.createElement("div");
    meta.className = "meta";

    const provider = document.createElement("span");
    provider.className = "provider";
    provider.textContent = q.provider || "";

    const time = document.createElement("span");
    time.textContent = formatTimestamp(q.timestamp);

    meta.appendChild(provider);
    meta.appendChild(time);

    item.appendChild(meta);

    const question = document.createElement("div");
    question.className = "question";
    question.textContent = q.question || "";

    if (q.questionSummary) {
      const summary = document.createElement("div");
      summary.className = "summary";
      summary.textContent = q.questionSummary;
      item.appendChild(summary);

      question.classList.add("collapsed");

      const toggle = document.createElement("button");
      toggle.className = "toggle-full";
      toggle.type = "button";
      toggle.textContent = "全文を見る";
      toggle.addEventListener("click", () => {
        const collapsed = question.classList.toggle("collapsed");
        toggle.textContent = collapsed ? "全文を見る" : "閉じる";
      });
      item.appendChild(toggle);
      item.appendChild(question);
    } else {
      item.appendChild(question);

      if ((q.question || "").length > SUMMARIZE_THRESHOLD) {
        const btn = document.createElement("button");
        btn.className = "summarize-btn";
        btn.type = "button";
        btn.textContent = "要約する";
        btn.addEventListener("click", () => summarize(q.id, btn, item));
        item.appendChild(btn);
      }
    }

    if (typeof q.conversationUrl === "string" && /^https?:\/\//i.test(q.conversationUrl)) {
      const linkWrap = document.createElement("div");
      linkWrap.className = "link";
      const a = document.createElement("a");
      a.href = q.conversationUrl;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "会話を開く →";
      linkWrap.appendChild(a);
      item.appendChild(linkWrap);
    }

    listEl.appendChild(item);
  }
}

async function summarize(id, btn, item) {
  btn.disabled = true;
  btn.textContent = "要約中…";

  const existingError = item.querySelector(".summarize-error");
  if (existingError) existingError.remove();

  try {
    const res = await fetch(`/api/questions/${encodeURIComponent(id)}/summarize`, {
      method: "POST",
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);

    const idx = allQuestions.findIndex((q) => q.id === id);
    if (idx !== -1) allQuestions[idx] = body;
    applySearch();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "要約する";
    const error = document.createElement("div");
    error.className = "summarize-error";
    error.textContent = "要約に失敗しました: " + err.message;
    item.appendChild(error);
  }
}

document.getElementById("refresh").addEventListener("click", loadQuestions);
document.getElementById("search").addEventListener("input", applySearch);
loadQuestions();
</script>
</body>
</html>
